# ==============================================================================
# CareFund Backend — Prometheus Scrape Configuration
# Topology: Internal service network (isolated, unexposed)
# Scrape Targets:
#   - CareFund API:    api:9090 (/metrics)
#   - CareFund Worker: worker:9091 (/metrics)
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: carefund-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'api:9090'
        labels:
          environment: production
          service: carefund-api

  - job_name: carefund-worker
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'worker:9091'
        labels:
          environment: production
          service: carefund-worker
