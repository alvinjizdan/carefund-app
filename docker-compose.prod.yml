# ==============================================================================
# CareFund Backend — Production Docker Compose Specification (Phase 5M.5B.2)
# Topology: Single VPS + Docker Compose + Managed PostgreSQL (External)
# Security Model:
#   - All inter-service traffic stays on isolated internal bridge network
#   - Public traffic enters via reverse proxy (Caddy, Phase 5M.5B.3) to api:8080
#   - Metrics endpoints (9090, 9091) and Prometheus are NEVER published to host
#   - Production database is external (managed cloud PostgreSQL)
#   - Secrets are injected via environment interpolation; fail-fast if unset
# ==============================================================================

services:
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: migrate
    image: carefund-migrate:production
    container_name: carefund-migrate
    restart: "no"
    networks:
      - carefund-internal
    environment:
      ENV: "production"
      LOG_FORMAT: "json"
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      DB_STATEMENT_TIMEOUT: "${DB_STATEMENT_TIMEOUT:-30s}"
      DB_LOCK_TIMEOUT: "${DB_LOCK_TIMEOUT:-10s}"
    command: ["-path=/app/migrations", "up"]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: server
    image: carefund-server:production
    container_name: carefund-api
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - carefund-internal
    expose:
      - "8080"
      - "9090"
    environment:
      ENV: "production"
      PORT: "8080"
      METRICS_HOST: "0.0.0.0"
      METRICS_PORT: "9090"
      LOG_FORMAT: "json"
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-15m}"
      DB_STATEMENT_TIMEOUT: "${DB_STATEMENT_TIMEOUT:-15s}"
      DB_LOCK_TIMEOUT: "${DB_LOCK_TIMEOUT:-5s}"
      DB_IDLE_IN_TRANSACTION_TIMEOUT: "${DB_IDLE_IN_TRANSACTION_TIMEOUT:-10s}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY is required}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY is required}"
      MIDTRANS_ENVIRONMENT: "${MIDTRANS_ENVIRONMENT:-production}"
      PAYMENT_PENDING_TTL: "${PAYMENT_PENDING_TTL:-45m}"
      OUTBOX_PROCESSING_TTL: "${OUTBOX_PROCESSING_TTL:-15m}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in production}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: worker
    image: carefund-worker:production
    container_name: carefund-worker
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - carefund-internal
    expose:
      - "9091"
    environment:
      ENV: "production"
      WORKER_METRICS_HOST: "0.0.0.0"
      WORKER_METRICS_PORT: "9091"
      LOG_FORMAT: "json"
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-15m}"
      DB_STATEMENT_TIMEOUT: "${DB_STATEMENT_TIMEOUT:-15s}"
      DB_LOCK_TIMEOUT: "${DB_LOCK_TIMEOUT:-5s}"
      DB_IDLE_IN_TRANSACTION_TIMEOUT: "${DB_IDLE_IN_TRANSACTION_TIMEOUT:-10s}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY is required}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY is required}"
      MIDTRANS_ENVIRONMENT: "${MIDTRANS_ENVIRONMENT:-production}"
      PAYMENT_PENDING_TTL: "${PAYMENT_PENDING_TTL:-45m}"
      OUTBOX_PROCESSING_TTL: "${OUTBOX_PROCESSING_TTL:-15m}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: carefund-prometheus
    restart: unless-stopped
    networks:
      - carefund-internal
    expose:
      - "9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  carefund-internal:
    name: carefund-internal
    driver: bridge

volumes:
  prometheus_data:
    name: carefund_prometheus_data
